<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Info Hub</title>
<link id="app-favicon" rel="icon" type="image/svg+xml">
<script src="./vendor/marked.umd.js"></script>
<script src="./vendor/katex.min.js"></script>
<style>
:root{
  --bg:#0f141c;--lane:#161d27;--card:#1d2532;--line:#232c39;--ink:#e8eef6;--sub:#93a2b6;--mute:#6f7d90;
  --accent:#2563eb;--on-accent:#fff;
  --input-bg:#1c2430;--input-border:#2a3442;
  --btn:#28334a;--btn-ink:#cfe0ff;--btn-hover:#344264;
  --sum:#c4cfdd;--link:#8ab4ff;
  --tag-border:#2f3b4d;--tag-hover-border:#5b7bd5;--tag-hover-ink:#cfe0ff;
  --chip-bg:#1c2430;--chip-ink:#aeb9c8;
  --scroll:#39465a;--scroll-hover:#4d5e78;--dash:#2f3b4d;--stripe:#121926;
  --wx:#07c160;--lark:#3370ff;--p0:#ef4444;--p1:#f59e0b;--p2:#3b82f6;--p3:#3a4658;--ok:#22c55e}
:root[data-theme="light"]{
  --bg:#f6f7f9;--lane:#ffffff;--card:#ffffff;--line:#e3e6ea;--ink:#1b2130;--sub:#5b6474;--mute:#8a93a0;
  --accent:#2563eb;--on-accent:#fff;
  --input-bg:#ffffff;--input-border:#cfd5dc;
  --btn:#eaf0fb;--btn-ink:#1d4ed8;--btn-hover:#dce6f8;
  --sum:#3a4250;--link:#1d4ed8;
  --tag-border:#d4dae2;--tag-hover-border:#2563eb;--tag-hover-ink:#1d4ed8;
  --chip-bg:#f1f3f6;--chip-ink:#5b6474;
  --scroll:#c7cfda;--scroll-hover:#aab3bf;--dash:#d4dae2;--stripe:#f3f5f8;
  --p3:#cbd2db}
.viewer-mode #scopeToggle,.viewer-mode #q,.viewer-mode #poll,.viewer-mode #status,.viewer-mode header form,.viewer-mode #navIcons,.viewer-mode .hdr-sep{display:none!important}
.window-controls,.window-edge{display:none}
.desktop-icon{display:block;width:24px;height:24px;color:var(--link);margin-right:7px;flex:none}
#app-brand{display:flex;align-items:center;user-select:none;cursor:default}
:root[data-desktop] header{padding-right:0;user-select:none}
:root[data-desktop] .window-controls{display:flex;align-self:stretch;flex:0 0 auto;margin:-10px 0 -10px 4px}
.window-controls button{width:38px;min-height:48px;padding:0;border:0;border-radius:0;background:transparent;color:var(--ink);font:12px "Segoe MDL2 Assets";cursor:default}
.window-controls button:hover{background:var(--btn-hover)}
.window-controls button:focus-visible{outline:2px solid var(--link);outline-offset:-3px}
.window-controls .window-close:hover{background:#dc2626;color:white}
:root[data-desktop] header>#status{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root[data-desktop] header>#q{width:clamp(100px,14vw,220px)}
:root[data-desktop]:not([data-maximized]) .window-edge{display:block;position:fixed;z-index:1000}
.window-edge[data-edge=n],.window-edge[data-edge=s]{left:6px;right:6px;height:4px;cursor:ns-resize}
.window-edge[data-edge=n]{top:0}.window-edge[data-edge=s]{bottom:0}
.window-edge[data-edge=w],.window-edge[data-edge=e]{top:6px;bottom:6px;width:4px;cursor:ew-resize}
.window-edge[data-edge=w]{left:0}.window-edge[data-edge=e]{right:0}
.window-edge[data-edge=nw],.window-edge[data-edge=ne],.window-edge[data-edge=sw],.window-edge[data-edge=se]{width:6px;height:6px}
.window-edge[data-edge=nw]{top:0;left:0;cursor:nwse-resize}.window-edge[data-edge=ne]{top:0;right:0;cursor:nesw-resize}
.window-edge[data-edge=sw]{bottom:0;left:0;cursor:nesw-resize}.window-edge[data-edge=se]{bottom:0;right:0;cursor:nwse-resize}
@media(max-width:1100px){
  :root[data-desktop] header{flex-wrap:wrap}
  :root[data-desktop] #app-brand,:root[data-desktop] #tabs,:root[data-desktop] .window-controls{order:-2}
  :root[data-desktop] #tabs{flex-basis:0}
  :root[data-desktop] header::after{content:"";flex-basis:100%;height:0;order:-1}
  :root[data-desktop] .window-controls{align-self:center;margin-bottom:-2px}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}
header b{font-size:16px;margin-right:8px;flex:0 0 auto}
header>.icon-btn,header>.hdr-group,header>.hdr-sep,header>.seg,header>#scopeToggle,header>#q,header>#poll,header>.status,header>form{flex:0 0 auto}
#tabs{display:flex;gap:2px;flex:1 1 auto;min-width:40px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
#tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--sub);padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;flex:0 0 auto;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--on-accent)}
.sp{flex:0 0 0}
input,select,textarea{font:inherit;line-height:1.45;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--ink);padding:6px 10px}
input{width:220px}select{min-height:34px}textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--link) 28%,transparent);outline-offset:1px;border-color:var(--link)}
input[type=checkbox]{width:16px;height:16px;min-height:16px;padding:0;accent-color:var(--link);vertical-align:middle}
button.b{background:var(--btn);color:var(--btn-ink);border:0;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
button.b:hover{background:var(--btn-hover)}
button.b.ok-btn{background:#1f6f43;color:#dff3e6}
/* Right-hand header controls, same shape as ARK: 32px outlined icon buttons, EN | 中 segment. */
.hdr-group{display:flex;gap:4px;align-items:center}
.hdr-sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;background:none;border:1px solid var(--input-border);border-radius:8px;color:var(--sub);cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{color:var(--ink);border-color:var(--link)}
.icon-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.icon-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.seg{display:inline-flex;height:32px;border:1px solid var(--input-border);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:0 9px;font:600 12px system-ui,"Microsoft YaHei",sans-serif;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.today-sec{margin:0 0 6px}
.today-sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);margin:8px 2px 6px;user-select:none}
.today-sec>summary::-webkit-details-marker{display:none}
.today-sec>summary::before{content:"▸";color:var(--mute);font-size:10px;width:10px}
.today-sec[open]>summary::before{content:"▾"}
.today-sec>summary .n{font-weight:500;color:var(--mute);background:var(--chip-bg);border-radius:99px;padding:0 7px;font-size:11px}
.today-sec.alert>summary{color:var(--p0)}
.today-sec .day{margin:8px 2px 4px 14px;font-weight:500;color:var(--mute)}
.lane-tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:-4px 0 6px}
.lane-tools .chip{padding:1px 9px}
.type-chips{margin:0 0 8px;gap:3px}
.type-chips .chip{font-size:11.5px;padding:0 8px}
.type-chips .chip i.cnt{display:inline;width:auto;height:auto;background:none;margin:0 0 0 2px;color:inherit;opacity:.65}
.more-row{display:flex;align-items:center;gap:8px;margin:2px 2px 8px;font-size:12px;color:var(--mute)}
.pin-note{color:#fbbf24}
.status{font-size:12px;color:var(--mute)}
main{padding:12px 16px}
.grid{display:grid;gap:12px;align-items:start}
.grid.resizable{gap:0}
.col-resizer{cursor:col-resize;position:relative;align-self:stretch;min-height:120px}
.col-resizer::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--line);border-radius:2px}
.col-resizer:hover::before,.col-resizer.dragging::before{background:var(--link);width:3px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media(max-width:1000px){.g3,.g2{grid-template-columns:1fr}}
.lane{background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:calc(100vh - 90px);overflow:auto}
.lane h2{margin:2px 2px 10px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);display:flex;justify-content:space-between}
.it{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;border-left:3px solid var(--p3)}
.it.P0{border-left-color:var(--p0)}.it.P1{border-left-color:var(--p1)}.it.P2{border-left-color:var(--p2)}.it.done{opacity:.55}
.it.mine{border-left-color:#fbbf24}                     /* same "for me" amber as the graph ring */
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.src{font-weight:700;font-size:10.5px;border-radius:4px;padding:0 5px;color:#fff;background:#555}
.src.lark{background:#3370ff}.src.linkedin{background:#0a66c2}
.src.x{background:#101419}.src.instagram{background:#c13584}.src.whatsapp{background:#25d366}
.src.slack{background:#611f69}.src.telegram{background:#229ed9}
.title{font-weight:600}.text{white-space:pre-wrap;word-break:break-word;max-height:8em;overflow:hidden}
.chat-text{white-space:pre-wrap;word-break:break-word;line-height:1.55}
.chat-tool-status{margin:2px 0 7px;color:var(--mute);font-size:12px}
.md-reasoning{margin:2px 0 8px;border-left:2px solid var(--line);padding-left:8px}
.md-reasoning>summary{cursor:pointer;color:var(--mute);font-size:11.5px;list-style:none}
.md-reasoning>summary::-webkit-details-marker{display:none}
.md-reasoning>summary::before{content:"▸ ";color:var(--mute)}
.md-reasoning[open]>summary::before{content:"▾ "}
.reasoning-text{white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto;color:var(--mute);font-size:12px;line-height:1.5;margin-top:4px}
.md{line-height:1.55;word-break:break-word}
.it,.sum,.md{min-width:0}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md-math{font-size:1.1em;overflow-wrap:normal;word-break:normal}
.md-math.display{display:block;max-width:100%;overflow-x:auto;padding:6px 0}
.md-math math{font-family:"Cambria Math",math}
.md .math-error{font:inherit;white-space:pre-wrap;color:var(--sub)}
.md del{color:var(--sub)}
.md p{margin:.4em 0}.md h4{margin:.6em 0 .3em;font-size:14px}.md h5{margin:.5em 0 .3em;font-size:13px;color:var(--sub)}
.md ul,.md ol{margin:.3em 0;padding-left:1.4em}.md li{margin:.15em 0}
.md code{background:var(--chip-bg);border:1px solid var(--input-border);border-radius:4px;padding:0 4px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.md pre{position:relative;background:var(--stripe);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:.5em 0;overflow:auto}
.md pre code{background:none;border:0;padding:0;white-space:pre}
.md-table-wrap{overflow:auto;margin:.55em 0;border:1px solid var(--line);border-radius:8px}
.md-table{border-collapse:collapse;width:100%;min-width:360px;font-size:12.5px}
.md-table th,.md-table td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md-table th{background:var(--stripe);color:var(--ink);font-weight:650}
.md-table tr:last-child td{border-bottom:0}
.md-html{margin:.55em 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--stripe)}
.md-html .md-html-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);color:var(--sub);font-size:11px}
.md-html iframe{display:block;width:100%;min-height:180px;border:0;background:#fff}
.md-mermaid{margin:.55em 0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--stripe);overflow:auto}
.md-mermaid svg{display:block;min-width:320px;max-width:100%;height:auto}
.md-mermaid .mermaid-fallback{white-space:pre-wrap;color:var(--sum);font-family:ui-monospace,Consolas,monospace;font-size:12px}
.md blockquote{margin:.4em 0;padding:2px 10px;border-left:3px solid var(--dash);color:var(--sum)}
.md a{text-decoration:underline}
.code-copy{position:absolute;right:6px;top:6px;opacity:.6;font-size:11px}.md pre:hover .code-copy{opacity:1}
.msg-copy{margin-left:auto;font-size:11px}
.caret{animation:blink 1s step-end infinite;color:var(--link);font-weight:700}
@keyframes blink{50%{opacity:0}}
.chip.ref{cursor:pointer;background:var(--btn);color:var(--btn-ink);border-color:transparent;font-weight:600}
.chip.ref:hover{background:var(--btn-hover)}
.float-card{position:fixed;width:min(380px,calc(100% - 16px));max-height:min(72vh,calc(100% - 16px));overflow:auto;background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;box-shadow:0 10px 36px rgba(0,0,0,.45);z-index:60}
.fc-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px -4px 4px;position:sticky;top:-10px;background:var(--lane);padding:2px 4px}
.fc-grip{cursor:move;color:var(--mute);user-select:none;letter-spacing:2px}
.float-close{padding:1px 8px}
.link-preview-trigger{padding:0 3px;margin-left:3px;border:0;background:transparent;color:var(--mute);cursor:pointer;font:inherit}
.update-banner{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid #fbbf24;border-left:4px solid #fbbf24;border-radius:9px;padding:7px 10px;box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:12.5px}
.update-banner .b{padding:3px 9px}
.sum{color:var(--sum);font-size:12.5px;margin-top:2px}
.acts{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.agent-section{margin:10px 0;border-top:1px solid var(--line);padding-top:7px}
.agent-section>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sub);padding:3px 0}
.agent-section[open]>summary{margin-bottom:7px}
.unit-menu{position:fixed;z-index:90;min-width:190px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;padding:4px;background:var(--lane);border:1px solid var(--input-border);border-radius:8px;box-shadow:0 6px 24px #0003}
.unit-menu button{display:block;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:6px 10px;border-radius:4px;cursor:pointer}
.unit-menu button:hover,.unit-menu button:focus{background:var(--btn);outline:none}
.unit-menu button:disabled{color:var(--mute);cursor:default}
.unit-dialog{width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:18px;border:1px solid var(--input-border);border-radius:8px;background:var(--lane);color:var(--ink);overflow:auto;font:inherit}
.unit-dialog::backdrop{background:#0006}
.unit-dialog h2{font-size:16px;margin:0 0 12px}
.unit-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.unit-fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);min-width:0}
.unit-fields input,.unit-fields select,.unit-fields textarea{width:100%;min-width:0;font-size:13px}
.unit-fields .wide{grid-column:1 / -1}
.unit-dialog textarea{min-height:100px}
.unit-dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.unit-error{color:var(--p0);font-size:12px;white-space:pre-wrap}
@media(max-width:480px){.unit-fields{grid-template-columns:minmax(0,1fr)}.unit-dialog{padding:12px}}
.group-filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(120px,1fr));gap:7px;margin-bottom:10px}
.group-filters input,.group-filters select{width:100%;min-width:0}
.group-card{min-width:0}
.group-messages{margin-top:7px;padding-top:5px;border-top:1px solid var(--line);max-height:340px;overflow:auto}
.group-messages .msg{padding:3px 0;border-bottom:1px dashed var(--line)}
.group-messages .msg:last-child{border-bottom:0}
@media(max-width:850px){.group-filters{grid-template-columns:1fr 1fr}.group-filters input{grid-column:1 / -1}}
header>#q{width:clamp(120px,13vw,220px)}
@media(max-width:1250px){header>#status{display:none}}   /* give the tabs room; the time is informational */
/* Phones: tabs get their own scrollable row so every header control stays reachable. */
@media(max-width:700px){header{flex-wrap:wrap;row-gap:6px;padding:8px 10px}#tabs{order:5;flex:1 1 100%}header>#q{flex:1 1 90px;width:auto;min-width:0}header>#status{display:none}header>form{display:none}}
.tag{display:inline-block;font-size:11px;border:1px solid var(--tag-border);border-radius:4px;padding:0 5px;color:var(--sub);margin:1px 2px 1px 0;cursor:pointer}
.tag:hover{border-color:var(--tag-hover-border);color:var(--tag-hover-ink)}
.tag.rm{cursor:pointer;background:var(--chip-bg)}.tag.rm:hover{border-color:#ef4444;color:#ef4444}
.tag-editor{margin-top:7px;padding:8px;border:1px dashed var(--dash);border-radius:8px;background:var(--stripe)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{font-size:12px;background:var(--chip-bg);border:1px solid var(--input-border);border-radius:99px;padding:2px 9px;color:var(--chip-ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.chip i{color:var(--mute);font-style:normal}
.when{color:var(--p1);font-weight:600}.overdue{color:var(--p0)}.ago{color:var(--mute)}
.kids{margin-left:14px;border-left:1px dashed var(--dash);padding-left:8px;margin-top:6px}
.msg{font-size:12.5px;color:var(--sum);margin:3px 0;white-space:pre-wrap;word-break:break-word}.msg i{color:var(--mute);font-style:normal}
.acts a.b{display:inline-block;text-decoration:none;background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:3px 9px;font-size:12px}
.acts a.b:hover{background:var(--btn-hover)}
.empty{color:var(--mute);font-size:12.5px;padding:6px}
.graph-controls{padding:6px 14px 2px;display:flex;flex-direction:column;gap:5px}
.graph-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--sub)}
.graph-row b{color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.04em;min-width:52px}
.graph-sel{background:var(--input-bg);color:var(--ink);border:1px solid var(--input-border);border-radius:6px;padding:1px 5px;font-size:12px}
.tag-editor select.graph-sel{height:28px;min-height:0;padding:1px 6px;line-height:1.2;vertical-align:middle}
.tag-editor .chips{align-items:center}
.graph-row .gsep{color:var(--mute)}
.kind-chip{text-transform:capitalize;padding:1px 8px}.kind-chip:not(.on){opacity:.5}
.kind-chip i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px;vertical-align:middle}
.gs{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute)}.gs input[type=range]{width:92px;accent-color:var(--link)}
.graph-host{position:relative;flex:1 1 auto;min-height:340px;width:100%}
.graph-host canvas{display:block;cursor:grab}.graph-host canvas:active{cursor:grabbing}
.graph-legend{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--mute);background:var(--lane);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:72%;pointer-events:none}
.graph-legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:4px;vertical-align:middle}
.graph-hint{position:absolute;right:10px;top:8px;font-size:11px;color:var(--mute);pointer-events:none}
.graph-count{position:absolute;left:10px;top:8px;font-size:11px;color:var(--mute);pointer-events:none}
.graph-overlay{position:absolute;right:12px;top:30px;width:min(360px,80%);max-height:calc(100% - 46px);overflow:auto;background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:5}
.graph-close{position:absolute;right:8px;top:8px;z-index:6}
.gantt-host{display:flex;flex-direction:column;overflow:hidden;padding:12px 14px 18px;min-height:340px}
.gantt-scroll{min-width:0;min-height:0;overflow:auto;position:relative;flex:1 1 auto}
.gantt-chart{width:max-content;min-width:720px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--input-bg)}
.gantt-axis,.gantt-line{display:grid;grid-template-columns:220px minmax(500px,1fr);min-height:28px}
.gantt-axis{border-bottom:1px solid var(--line);background:var(--lane);position:sticky;top:0;z-index:2}
.gantt-axis-label{position:sticky;left:0;z-index:4;padding:7px 10px;font-size:11px;color:var(--mute);border-right:1px solid var(--line);background:var(--lane);display:flex;align-items:center}
.gantt-scale{position:relative;height:52px}
.gantt-scale-row{position:absolute;left:0;right:0;height:26px}
.gantt-scale-row.date{top:0;border-bottom:1px solid var(--line)}
.gantt-scale-row.hour{top:26px}
.gantt-tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);color:var(--mute);font-size:10px;padding:6px 4px;white-space:nowrap}
.gantt-line{min-height:34px;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.gantt-line:last-child{border-bottom:0}
.gantt-row-label{position:sticky;left:0;z-index:3;padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line);background:var(--input-bg);font-size:12px}
.gantt-track{position:relative;min-height:34px;background-image:linear-gradient(to right,color-mix(in srgb,var(--line) 65%,transparent) 1px,transparent 1px);background-size:20% 100%}
.gantt-bar{position:absolute;top:6px;height:22px;border:0;border-radius:5px;padding:3px 7px;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--on-accent);font-size:11px;font-weight:600;cursor:pointer;min-width:28px}
.gantt-bar:hover{filter:brightness(1.15);box-shadow:0 0 0 2px var(--on-accent)}
.gantt-bar.mine{outline:2px solid #fbbf24;outline-offset:1px}   /* same "for me" amber as the graph ring */
.gantt-point{position:absolute;top:11px;width:12px;min-width:0;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--on-accent);box-sizing:border-box;cursor:pointer;padding:0}
.gantt-point:hover{transform:scale(1.3);box-shadow:0 0 0 2px var(--on-accent)}
.gantt-empty{padding:30px;color:var(--mute);text-align:center}
.day{font-size:12px;color:var(--sub);margin:10px 2px 4px;font-weight:600}
table.kv td{padding:2px 8px;font-size:12.5px;color:var(--sum)}
.schedule-form{container-type:inline-size;padding:10px 12px;border-left:3px solid var(--link);background:var(--card)}
.schedule-grid{display:grid;grid-template-columns:minmax(120px,1fr) minmax(240px,1.4fr);gap:8px 12px}
.schedule-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.schedule-field-wide{grid-column:1 / -1}
.schedule-label{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:0}
.schedule-form input:not([type=checkbox]),.schedule-form select,.schedule-form textarea{font-size:13px;padding:4px 8px}
.schedule-form select{min-height:30px}
.schedule-form textarea{min-height:58px;height:72px}
.schedule-when{display:grid;grid-template-columns:minmax(76px,.7fr) minmax(128px,1fr);gap:6px;align-items:center}
.schedule-timing{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:5px;min-width:0;color:var(--sub);font-size:12px}
.schedule-timing>span:last-child{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap}
.schedule-timing input{min-width:0;width:100%}
.schedule-toggle{display:flex;align-items:center;gap:6px;min-height:26px;margin-right:auto;color:var(--sum);font-size:13px}
.schedule-actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px}
.agent-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;margin:4px 0}
.agent-link{display:inline-flex;align-items:center;background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:3px 9px;font-size:12px;line-height:1.5;text-decoration:none}
.agent-link:hover{background:var(--btn-hover);text-decoration:none}
.agent-toolbar>.agent-link{margin-left:auto}
.agent-queue{margin-top:5px;border-top:1px solid var(--line)}
.agent-row{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.agent-row-head{display:flex;gap:8px;align-items:center;min-width:0}
.agent-row-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);text-decoration:none;font-weight:500}
a.agent-row-title:hover{color:var(--link);text-decoration:underline}
.agent-row-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;margin-top:3px;font-size:11.5px;color:var(--mute)}
.agent-row-meta .status{font-size:inherit}
.agent-controls{display:flex;gap:4px;flex-shrink:0;align-items:center}
.agent-controls button.b,.agent-controls .agent-link{padding:2px 7px;font-size:12px;line-height:1.5}
.agent-controls button:disabled{cursor:default;opacity:.45}
.agent-error{color:var(--p0);font-size:12px;overflow-wrap:anywhere}
.agent-row details{margin-top:3px;font-size:12px}
@media(max-width:520px){.agent-row-head{flex-wrap:wrap}.agent-row-title{flex-basis:100%}.agent-controls{margin-left:auto}}
@container (max-width:460px){.schedule-grid{grid-template-columns:1fr}.schedule-field-wide{grid-column:auto}}
@container (max-width:280px){.schedule-when{grid-template-columns:1fr}}
a{color:var(--link)}
*{scrollbar-width:thin;scrollbar-color:var(--scroll) var(--lane)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--lane);border-radius:8px}
::-webkit-scrollbar-thumb{background:var(--scroll);border:2px solid var(--lane);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
::-webkit-scrollbar-corner{background:var(--lane)}
select,option{background:var(--input-bg);color:var(--ink)}
.src.s-ok{background:#1f6f43}.src.s-wait{background:#8a6212}.src.s-err{background:#9b2c2c}
.run{display:grid;grid-template-columns:62px 58px minmax(120px,auto) 1fr 42px;gap:8px;align-items:baseline;
padding:4px 6px;border-radius:6px;font-size:12.5px;border-left:3px solid transparent}
.run:nth-child(odd){background:var(--stripe)}
.run.ok{border-left-color:#22c55e}.run.waiting{border-left-color:var(--p1)}.run.error{border-left-color:var(--p0)}
.run .t{color:var(--mute);font-variant-numeric:tabular-nums}
.run .who{color:#c4cfdd}.run .det{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .secs{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
</style>
