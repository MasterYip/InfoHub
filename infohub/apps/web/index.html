<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Info Hub</title>
<style>
:root{
  --bg:#0f141c;--lane:#161d27;--card:#1d2532;--line:#232c39;--ink:#e8eef6;--sub:#93a2b6;--mute:#6f7d90;
  --accent:#2563eb;--on-accent:#fff;
  --input-bg:#1c2430;--input-border:#2a3442;
  --btn:#28334a;--btn-ink:#cfe0ff;--btn-hover:#344264;
  --sum:#c4cfdd;--link:#8ab4ff;
  --tag-border:#2f3b4d;--tag-hover-border:#5b7bd5;--tag-hover-ink:#cfe0ff;
  --chip-bg:#1c2430;--chip-ink:#aeb9c8;
  --scroll:#39465a;--scroll-hover:#4d5e78;--dash:#2f3b4d;--stripe:#121926;
  --wx:#07c160;--lark:#3370ff;--p0:#ef4444;--p1:#f59e0b;--p2:#3b82f6;--p3:#3a4658;--ok:#22c55e}
:root[data-theme="light"]{
  --bg:#f6f7f9;--lane:#ffffff;--card:#ffffff;--line:#e3e6ea;--ink:#1b2130;--sub:#5b6474;--mute:#8a93a0;
  --accent:#2563eb;--on-accent:#fff;
  --input-bg:#ffffff;--input-border:#cfd5dc;
  --btn:#eaf0fb;--btn-ink:#1d4ed8;--btn-hover:#dce6f8;
  --sum:#3a4250;--link:#1d4ed8;
  --tag-border:#d4dae2;--tag-hover-border:#2563eb;--tag-hover-ink:#1d4ed8;
  --chip-bg:#f1f3f6;--chip-ink:#5b6474;
  --scroll:#c7cfda;--scroll-hover:#aab3bf;--dash:#d4dae2;--stripe:#f3f5f8;
  --p3:#cbd2db}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}
header b{font-size:16px;margin-right:8px;flex:0 0 auto}
header>#themeBtn,header>#scopeToggle,header>#q,header>#poll,header>.status,header>form{flex:0 0 auto}
#tabs{display:flex;gap:2px;flex:1 1 auto;min-width:40px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
#tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--sub);padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;flex:0 0 auto;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--on-accent)}
.sp{flex:0 0 0}
input{background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--ink);padding:6px 10px;width:220px}
button.b{background:var(--btn);color:var(--btn-ink);border:0;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
button.b:hover{background:var(--btn-hover)}
button.b.ok-btn{background:#1f6f43;color:#dff3e6}
#themeBtn{background:none;border:1px solid var(--input-border);color:var(--sub);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px}
.status{font-size:12px;color:var(--mute)}
main{padding:12px 16px}
.grid{display:grid;gap:12px;align-items:start}
.grid.resizable{gap:0}
.col-resizer{cursor:col-resize;position:relative;align-self:stretch;min-height:120px}
.col-resizer::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--line);border-radius:2px}
.col-resizer:hover::before,.col-resizer.dragging::before{background:var(--link);width:3px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media(max-width:1000px){.g3,.g2{grid-template-columns:1fr}}
.lane{background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:calc(100vh - 90px);overflow:auto}
.lane h2{margin:2px 2px 10px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);display:flex;justify-content:space-between}
.it{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;border-left:3px solid var(--p3)}
.it.P0{border-left-color:var(--p0)}.it.P1{border-left-color:var(--p1)}.it.P2{border-left-color:var(--p2)}.it.done{opacity:.55}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.src{font-weight:700;font-size:10.5px;border-radius:4px;padding:0 5px;color:#fff;background:#555}
.src.lark{background:#3370ff}.src.linkedin{background:#0a66c2}
.src.x{background:#101419}.src.instagram{background:#c13584}.src.whatsapp{background:#25d366}
.src.slack{background:#611f69}.src.telegram{background:#229ed9}
.title{font-weight:600}.text{white-space:pre-wrap;word-break:break-word;max-height:8em;overflow:hidden}
.chat-text{white-space:pre-wrap;word-break:break-word;line-height:1.55}
.md{line-height:1.55;word-break:break-word}
.md p{margin:.4em 0}.md h4{margin:.6em 0 .3em;font-size:14px}.md h5{margin:.5em 0 .3em;font-size:13px;color:var(--sub)}
.md ul,.md ol{margin:.3em 0;padding-left:1.4em}.md li{margin:.15em 0}
.md code{background:var(--chip-bg);border:1px solid var(--input-border);border-radius:4px;padding:0 4px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.md pre{position:relative;background:var(--stripe);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:.5em 0;overflow:auto}
.md pre code{background:none;border:0;padding:0;white-space:pre}
.md blockquote{margin:.4em 0;padding:2px 10px;border-left:3px solid var(--dash);color:var(--sum)}
.md a{text-decoration:underline}
.code-copy{position:absolute;right:6px;top:6px;opacity:.6;font-size:11px}.md pre:hover .code-copy{opacity:1}
.msg-copy{margin-left:auto;font-size:11px}
.caret{animation:blink 1s step-end infinite;color:var(--link);font-weight:700}
@keyframes blink{50%{opacity:0}}
.chip.ref{cursor:pointer;background:var(--btn);color:var(--btn-ink);border-color:transparent;font-weight:600}
.chip.ref:hover{background:var(--btn-hover)}
.float-card{position:fixed;width:min(380px,92vw);max-height:72vh;overflow:auto;background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;box-shadow:0 10px 36px rgba(0,0,0,.45);z-index:60}
.fc-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px -4px 4px;position:sticky;top:-10px;background:var(--lane);padding:2px 4px}
.fc-grip{cursor:move;color:var(--mute);user-select:none;letter-spacing:2px}
.float-close{padding:1px 8px}
.sum{color:var(--sum);font-size:12.5px;margin-top:2px}
.acts{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;border:1px solid var(--tag-border);border-radius:4px;padding:0 5px;color:var(--sub);margin:1px 2px 1px 0;cursor:pointer}
.tag:hover{border-color:var(--tag-hover-border);color:var(--tag-hover-ink)}
.tag.rm{cursor:pointer;background:var(--chip-bg)}.tag.rm:hover{border-color:#ef4444;color:#ef4444}
.tag-editor{margin-top:7px;padding:8px;border:1px dashed var(--dash);border-radius:8px;background:var(--stripe)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{font-size:12px;background:var(--chip-bg);border:1px solid var(--input-border);border-radius:99px;padding:2px 9px;color:var(--chip-ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.chip i{color:var(--mute);font-style:normal}
.when{color:var(--p1);font-weight:600}.overdue{color:var(--p0)}.ago{color:var(--mute)}
.kids{margin-left:14px;border-left:1px dashed var(--dash);padding-left:8px;margin-top:6px}
.msg{font-size:12.5px;color:var(--sum);margin:3px 0;white-space:pre-wrap;word-break:break-word}.msg i{color:var(--mute);font-style:normal}
.empty{color:var(--mute);font-size:12.5px;padding:6px}
.graph-controls{padding:6px 14px 2px;display:flex;flex-direction:column;gap:5px}
.graph-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--sub)}
.graph-row b{color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.04em;min-width:52px}
.graph-sel{background:var(--input-bg);color:var(--ink);border:1px solid var(--input-border);border-radius:6px;padding:1px 5px;font-size:12px}
.graph-row .gsep{color:var(--mute)}
.kind-chip{text-transform:capitalize;padding:1px 8px}.kind-chip:not(.on){opacity:.5}
.kind-chip i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px;vertical-align:middle}
.gs{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute)}.gs input[type=range]{width:92px;accent-color:var(--link)}
.graph-host{position:relative;flex:1 1 auto;min-height:340px;width:100%}
.graph-host canvas{display:block;cursor:grab}.graph-host canvas:active{cursor:grabbing}
.graph-legend{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--mute);background:var(--lane);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:72%;pointer-events:none}
.graph-legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:4px;vertical-align:middle}
.graph-hint{position:absolute;right:10px;top:8px;font-size:11px;color:var(--mute);pointer-events:none}
.graph-count{position:absolute;left:10px;top:8px;font-size:11px;color:var(--mute);pointer-events:none}
.graph-overlay{position:absolute;right:12px;top:30px;width:min(360px,80%);max-height:calc(100% - 46px);overflow:auto;background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:5}
.graph-close{position:absolute;right:8px;top:8px;z-index:6}
.day{font-size:12px;color:var(--sub);margin:10px 2px 4px;font-weight:600}
table.kv td{padding:2px 8px;font-size:12.5px;color:var(--sum)}
a{color:var(--link)}
*{scrollbar-width:thin;scrollbar-color:var(--scroll) var(--lane)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--lane);border-radius:8px}
::-webkit-scrollbar-thumb{background:var(--scroll);border:2px solid var(--lane);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
::-webkit-scrollbar-corner{background:var(--lane)}
select,option{background:var(--input-bg);color:var(--ink)}
.src.s-ok{background:#1f6f43}.src.s-wait{background:#8a6212}.src.s-err{background:#9b2c2c}
.run{display:grid;grid-template-columns:62px 58px minmax(120px,auto) 1fr 42px;gap:8px;align-items:baseline;
padding:4px 6px;border-radius:6px;font-size:12.5px;border-left:3px solid transparent}
.run:nth-child(odd){background:var(--stripe)}
.run.ok{border-left-color:#22c55e}.run.waiting{border-left-color:var(--p1)}.run.error{border-left-color:var(--p0)}
.run .t{color:var(--mute);font-variant-numeric:tabular-nums}
.run .who{color:#c4cfdd}.run .det{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .secs{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <b>Info Hub</b>
  <span id="tabs"></span>
  <span class="sp"></span>
  <button id="themeBtn" title="Toggle light / dark"></button>
  <span id="scopeToggle" class="chips" style="margin:0"></span>
  <input id="q" placeholder="Search (Enter)">
  <button class="b" id="poll">Sync now</button>
  <span class="status" id="status"></span>
  <form method="post" action="/logout" style="margin:0"><button class="b" type="submit">Log out</button></form>
</header>
<main id="main"></main>
<datalist id="tagsuggest">
  <option value="importance:high"></option><option value="importance:medium"></option><option value="importance:low"></option>
  <option value="project:"></option><option value="course:"></option><option value="topic:"></option><option value="type:deadline"></option>
</datalist>
<script>
"use strict";
const $ = id => document.getElementById(id);
let CHAT = [];   // conversation history for the assistant
function el(tag, attrs = {}, ...kids) {             // message/unit text is only ever inserted as text nodes
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
}
const now = () => Date.now() / 1000;
const fmt = t => t ? new Date(t * 1000).toLocaleString([], {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
const dayKey = t => new Date(t * 1000).toLocaleDateString([], {weekday: "short", month: "numeric", day: "numeric"});
const safeLink = u => /^(https?:|lark:|feishu:)/i.test(u || "") ? u : null;
const SRC_LABEL = {lark: "LK", linkedin: "in", x: "X", instagram: "IG", whatsapp: "WA", slack: "SL", telegram: "TG"};
const SRC = s => { const k = (s || "").split(":")[0]; return SRC_LABEL[k] || k.slice(0, 2).toUpperCase(); };
async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname); throw new Error("login required"); }
  return (r.headers.get("content-type") || "").includes("json") ? r.json() : r.text();
}
let TAB = "today", SEL = new Set(), VIEWS = [], SCOPE = localStorage.getItem("scope") || "mine";
let EXPLORE_SORT = localStorage.getItem("exploreSort") || "activity";
let EXPLORE_VIEW = localStorage.getItem("exploreView") || "list";   // "list" | "graph"
const GRAPH_POS = {};   // node id -> {x,y,vx,vy}: positions persist across refreshes so the graph doesn't jump
const GRAPH_DEF = {repulsion: 5000, distance: 110, gravity: 0.0022};
const GRAPH_CFG = Object.assign({kinds: [], days: 0}, GRAPH_DEF,
  JSON.parse(localStorage.getItem("graphCfg") || "{}"));   // physics + graph-only filters (kind, time window)
const saveGraphCfg = () => localStorage.setItem("graphCfg", JSON.stringify(GRAPH_CFG));
const mineQ = () => SCOPE === "mine" ? "&mine=1" : "";
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
  const b = document.getElementById("themeBtn"); if (b) b.textContent = t === "light" ? "\u263E Dark" : "\u2600 Light";
}
applyTheme(localStorage.getItem("theme") || "dark");
document.getElementById("themeBtn").onclick = () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
function drawScope() {
  const pick = (v, label) => el("span", {class: "chip" + (SCOPE === v ? " on" : ""),
    onclick: () => { SCOPE = v; localStorage.setItem("scope", v); render(false); }}, label);
  $("scopeToggle").replaceChildren(pick("mine", "For me"), pick("all", "Everything"));
}

function lane(title, count, nodes, empty) {
  return el("section", {class: "lane"}, el("h2", {}, title, el("span", {}, count ?? "")),
    nodes.length ? nodes : el("div", {class: "empty"}, empty || "Nothing here."));
}
function srcBadge(source, account) { return el("span", {class: "src " + (source || "").split(":")[0]}, SRC(source) + (account ? ":" + account : "")); }
function teach(kind, source, value, label) {
  return el("button", {class: "b", onclick: async e => {
    e.target.disabled = true;
    await api("/api/teach", {kind, source, value, label});
    $("status").textContent = "✓ " + label.replace(/^[★→]\s*/, "") + " applied";
    const visible = kind === "mute" || kind === "watch" || kind === "digest";   // these move the card
    if (visible) { render(); } else { e.target.textContent = "✓ done"; e.target.classList.add("ok-btn"); }
  }}, label);
}
function msgCard(m, opts = {}) {
  const link = safeLink(m.link);
  return el("div", {class: "it " + (m.priority || "")},
    el("div", {class: "meta"}, srcBadge(m.source, m.account), m.channel_name, m.sender_name && "· " + m.sender_name, "· " + fmt(m.sent_at)),
    el("div", {class: "text"}, m.text || ""),
    el("div", {class: "acts"},
      opts.extra || null,
      el("button", {class: "b", onclick: async e => { e.target.disabled = true; await api("/api/done", {id: m.id}); render(); }}, "✓ Done"),
      link && el("a", {href: link, target: "_blank", rel: "noopener"}, el("button", {class: "b"}, "Open")),
      opts.teach !== false && m.sender && teach("vip", m.source, m.sender, "★ VIP " + (m.sender_name || "")),
      opts.teach !== false && teach("mute", m.source, m.channel, "Mute chat")));
}
function whenLabel(u) {
  const t = u.due_at || u.start_at; if (!t) return null;
  return el("span", {class: "when" + (t < now() && u.kind === "todo" ? " overdue" : "")}, (u.kind === "todo" ? "due " : "") + fmt(t));
}
function timeLabel(u) {                      // every unit shows when it is from
  const t = u.last_activity_at || u.updated_at || u.created_at;
  return t ? el("span", {class: "ago", title: new Date(t * 1000).toLocaleString()}, fmt(t)) : null;
}
function tagChips(tags) {
  return (tags || []).filter(t => !t.startsWith("source:")).map(t => el("span", {class: "tag", onclick: () => { SEL = new Set([t]); TAB = "explore"; render(); }}, t));
}
const IMPORTANCE = [["high", "⭐ High"], ["medium", "● Medium"], ["low", "○ Low"]];
function unitCard(u, depth = 0) {
  u.tags = u.tags || [];
  const tagRow = el("div", {});
  const box = el("div", {class: "it " + (u.priority || "") + (u.status !== "open" ? " done" : "")},
    el("div", {class: "meta"}, el("span", {class: "src"}, u.kind), whenLabel(u), timeLabel(u),
       u.n_children ? `· ${u.n_children} inside` : "", u.n_messages ? `· ${u.n_messages} msgs` : ""),
    el("div", {class: "title"}, u.title),
    u.summary && el("div", {class: "sum"}, u.summary),
    tagRow);
  // ---- tags: filter chips + an in-place editor (importance presets + free-form add/remove) ----
  const editor = el("div", {class: "tag-editor"}); editor.hidden = true;
  const paintTags = () => tagRow.replaceChildren(...tagChips(u.tags));
  const post = async body => { await api(`/api/unit/${u.id}`, body); };
  const addTag = async tag => {
    tag = (tag || "").trim(); if (!tag) return;
    await post({add_tags: [tag]});
    if (!u.tags.includes(tag)) u.tags = [...u.tags, tag].sort();
    paintTags(); paintEditor();
  };
  const removeTag = async tag => { await post({remove_tags: [tag]}); u.tags = u.tags.filter(t => t !== tag); paintTags(); paintEditor(); };
  const setImportance = async level => {
    const cur = u.tags.filter(t => t.startsWith("importance:")), want = "importance:" + level, off = cur.includes(want);
    await post({remove_tags: cur, add_tags: off ? [] : [want]});
    u.tags = u.tags.filter(t => !t.startsWith("importance:")); if (!off) u.tags = [...u.tags, want].sort();
    paintTags(); paintEditor();
  };
  const setKind = async k => { if (k === u.kind) return; await post({kind: k}); render(); };   // moves it into the right tab (e.g. Todos)
  function paintEditor() {
    const kindSel = el("select", {class: "graph-sel", title: "Change this unit's kind"});
    for (const k of Object.keys(KIND_COLOR)) { const o = el("option", {value: k}, k); if (k === u.kind) o.selected = true; kindSel.append(o); }
    kindSel.onchange = () => setKind(kindSel.value);
    const removable = u.tags.filter(t => !t.startsWith("source:") && t !== "type:" + u.kind);
    const chips = removable.map(t => el("span", {class: "tag rm", title: "Remove tag", onclick: () => removeTag(t)}, t, " ✕"));
    const inp = el("input", {placeholder: "add tag — e.g. project:x, importance:high", list: "tagsuggest",
      style: "flex:1;min-width:150px;padding:3px 7px;font-size:12px"});
    inp.onkeydown = e => { if (e.key === "Enter") { addTag(inp.value); inp.value = ""; } };
    editor.replaceChildren(
      el("div", {class: "chips", style: "margin-bottom:5px"}, el("span", {class: "status"}, "kind:"), kindSel),
      el("div", {class: "chips", style: "margin-bottom:5px"}, ...(chips.length ? chips : [el("span", {class: "status"}, "no custom tags yet")])),
      el("div", {class: "chips"}, el("span", {class: "status"}, "importance:"),
        ...IMPORTANCE.map(([v, label]) => el("span", {class: "chip" + (u.tags.includes("importance:" + v) ? " on" : ""), onclick: () => setImportance(v)}, label))),
      el("div", {style: "display:flex;gap:5px;margin-top:6px"}, inp,
        el("button", {class: "b", onclick: () => { addTag(inp.value); inp.value = ""; }}, "Add")));
  }
  paintTags();
  const acts = el("div", {class: "acts"});
  if (u.status === "open" && u.kind !== "digest") {
    acts.append(el("button", {class: "b", onclick: async e => { e.target.disabled = true; await api(`/api/unit/${u.id}`, {status: "done"}); render(); }}, "✓ Done"));
    acts.append(el("button", {class: "b", title: "Not relevant to me — hide it", onclick: async e => { e.target.disabled = true; await api(`/api/unit/${u.id}`, {status: "dropped"}); render(); }}, "⊘ Ignore"));
  }
  acts.append(el("button", {class: "b", title: "Add or remove tags", onclick: () => { if (editor.hidden) { paintEditor(); editor.hidden = false; } else editor.hidden = true; }}, "🏷 Tag"));
  const more = el("div", {class: "kids"}); more.hidden = true;
  acts.append(el("button", {class: "b", onclick: async () => {
    if (!more.hidden) { more.hidden = true; return; }

  async chat() {
    const log = el("div", {class: "lane", style: "height:calc(100vh - 150px);max-height:none"});
    let scrollPinned = true;
    log.onscroll = () => { scrollPinned = log.scrollHeight - log.scrollTop - log.clientHeight < 60; };
    const draw = () => {
      const cards = CHAT.map(m => {
        const meta = el("div", {class: "meta"}, el("b", {}, m.role === "user" ? "You" : "Assistant"),
          m.changes && m.changes.length ? el("span", {class: "tag"}, m.changes.length + " change(s)") : null,
          m.cost ? el("span", {class: "ago"}, "$" + m.cost) : null);
        if (m.role === "assistant" && m.content && !m.streaming)
          meta.append(el("button", {class: "b msg-copy", title: "Copy reply", onclick: e => copyText(m.content, e.target)}, "⧉ copy"));
        const bodyEl = m.role === "assistant"
          ? (m.content ? renderMarkdown(m.content) : el("span", {class: "status"}, m.streaming ? "…" : ""))
          : el("div", {class: "chat-text"}, m.content || "");
        if (m.streaming && m.content) bodyEl.append(el("span", {class: "caret"}, "▋"));
        return el("div", {class: "it " + (m.role === "user" ? "P2" : "")}, meta, bodyEl);
      });
      if (!CHAT.length) cards.push(el("div", {class: "empty"},
        "Ask about your hub, or tell me to do something — e.g. “what are my deadlines this week?”, "
        + "“find todos the hub missed in the robotics group”, “mark unit 42 done”, “tag the Lisbon topic as travel”."));
      log.replaceChildren(...cards);
      if (scrollPinned) log.scrollTop = log.scrollHeight;
    };
    const input = el("input", {placeholder: "Message the assistant… (Enter)", style: "flex:1"});
    const send = async () => {
      const text = input.value.trim(); if (!text) return;
      CHAT.push({role: "user", content: text}); input.value = "";
      const payload = CHAT.map(m => ({role: m.role, content: m.content}));
      const asst = {role: "assistant", content: "", changes: [], cost: 0, streaming: true};
      CHAT.push(asst); scrollPinned = true; draw();
      input.disabled = true; $("status").textContent = "thinking…";
      let streamed = false;
      try {
        const resp = await fetch("/api/chat/stream", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({messages: payload})});
        if (resp.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname); return; }
        if (!resp.ok || !resp.body) throw new Error("no stream");
        const reader = resp.body.getReader(), dec = new TextDecoder();
        let buf = "";
        for (;;) {
          const {value, done} = await reader.read(); if (done) break;
          buf += dec.decode(value, {stream: true});
          let idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            const line = buf.slice(0, idx).split("\n").find(l => l.startsWith("data:")); buf = buf.slice(idx + 2);
            if (!line) continue;
            const ev = JSON.parse(line.slice(5).trim()); streamed = true;
            if (ev.type === "delta") { asst.content += ev.text; draw(); }
            else if (ev.type === "status") { $("status").textContent = ev.text; }
            else if (ev.type === "error") { asst.content = (asst.content ? asst.content + "\n\n" : "") + "⚠ " + ev.text; }
            else if (ev.type === "done") { asst.changes = ev.changes || []; asst.cost = ev.cost || 0; }
          }
        }
      } catch (_) { streamed = false; }
      if (!streamed) {                                  // fallback: non-streaming endpoint
        const r = await api("/api/chat", {messages: payload});
        if (r.error) asst.content = "⚠ " + r.error;
        else { asst.content = r.reply; asst.changes = r.changes || []; asst.cost = r.cost || 0; }
      }
      asst.streaming = false;
      $("status").textContent = (asst.changes && asst.changes.length) ? asst.changes.length + " change(s) applied" : "";

    };
    input.onkeydown = e => { if (e.key === "Enter") send(); };
    draw();

      el("button", {class: "b", onclick: send, style: "padding:6px 14px"}, "Send"),
      el("button", {class: "b", onclick: () => { CHAT = []; draw(); }}, "Clear"));
    return el("div", {}, log, bar);
  },

// Lanes are keyed by tab + position, not by their heading: headings change
// (e.g. "Top-level units" -> "Matching units") while the lane stays the same.
function scrollState() {
  const out = {};
  document.querySelectorAll("#main .lane").forEach((l, i) => { if (l.scrollTop) out[TAB + ":" + i] = l.scrollTop; });
  return {lanes: out, page: window.scrollY, tab: TAB};
}
function restoreScroll(state) {
  if (state.tab !== TAB) return;
  document.querySelectorAll("#main .lane").forEach((l, i) => {
    const top = state.lanes[TAB + ":" + i];
    if (top != null) {
      l.scrollTop = top;
      if (l.scrollTop !== top) requestAnimationFrame(() => { l.scrollTop = top; });  // content still settling
    }
  });
  if (state.page) window.scrollTo(0, state.page);
}
// Make a multi-column grid's column widths draggable. A thin handle sits between columns; the
// chosen widths persist per tab+column-count in localStorage. Skipped on narrow (single-column) layouts.
function enhanceGrids(root) {
  if (window.matchMedia("(max-width:1000px)").matches) return;
  root.querySelectorAll(".grid.g2, .grid.g3").forEach(g => {
    if (g.dataset.rz) return;
    const cols = [...g.children], n = cols.length;
    if (n < 2) return;
    g.dataset.rz = "1"; g.classList.add("resizable");
    const key = "cols:" + TAB + ":" + n;
    let fr; try { fr = JSON.parse(localStorage.getItem(key)); } catch (_) { fr = null; }
    if (!Array.isArray(fr) || fr.length !== n) fr = n === 2 ? [1, 1.3] : Array(n).fill(1);
    const apply = () => {
      const p = []; for (let i = 0; i < n; i++) { p.push(fr[i].toFixed(3) + "fr"); if (i < n - 1) p.push("10px"); }
      g.style.gridTemplateColumns = p.join(" ");
    };
    for (let i = 1; i < n; i++) {
      const rz = el("div", {class: "col-resizer", title: "Drag to resize columns"});
      g.insertBefore(rz, cols[i]);
      rz.onmousedown = e => {
        e.preventDefault(); rz.classList.add("dragging"); document.body.style.cursor = "col-resize";
        const rect = g.getBoundingClientRect(), usable = rect.width - 10 * (n - 1), total = fr.reduce((a, b) => a + b, 0);
        let before = 0; for (let k = 0; k < i - 1; k++) before += fr[k];
        const pair = fr[i - 1] + fr[i];
        const move = ev => {
          let x = Math.max(0, Math.min(usable, ev.clientX - rect.left - 10 * (i - 1)));
          let left = (x / usable) * total - before;
          left = Math.max(0.2, Math.min(pair - 0.2, left));
          fr[i - 1] = left; fr[i] = pair - left; apply();
        };
        const up = () => {
          rz.classList.remove("dragging"); document.body.style.cursor = "";
          document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up);
          try { localStorage.setItem(key, JSON.stringify(fr)); } catch (_) {}
        };
        document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
      };
    }
    apply();
  });
}
async function render(keepScroll = true) {
  const state = keepScroll ? scrollState() : {lanes: {}, page: 0};
  drawTabs(); drawScope();
  const node = TAB.startsWith("view") ? await viewTab(VIEWS[+TAB.slice(4)]) : await TABS[TAB]();
  $("main").replaceChildren(node);
  enhanceGrids($("main"));
  if (keepScroll) restoreScroll(state);
  $("status").textContent = "updated " + new Date().toLocaleTimeString();
}

function goTag(tag) { SEL = new Set([tag]); TAB = "explore"; $("q").value = ""; render(false); }
$("q").onkeydown = async e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim(); if (!q) return render();
  const d = await api("/api/search?q=" + encodeURIComponent(q));
  const facet = (title, items, make) => items.length
    ? el("div", {}, el("div", {class: "day"}, `${title} (${items.length})`), el("div", {class: "chips"}, ...items.map(make)))
    : null;
  const left = el("div", {},
    facet("People", d.people, p => el("span", {class: "chip", title: `${p.n} msgs`,
      onclick: () => goTag("person:" + p.sender_name)}, srcBadge(p.source), " ", p.sender_name, " ", el("i", {}, p.n))),
    facet("Chats", d.channels, c => el("span", {class: "chip", title: `${c.policy} · ${c.n} msgs`,
      onclick: () => goTag("channel:" + c.channel_name)}, srcBadge(c.source, c.account), " ", c.channel_name || c.channel, " ", el("i", {}, c.n))),
    facet("Tags", d.tags, t => el("span", {class: "chip", onclick: () => goTag(t.tag)}, t.tag, " ", el("i", {}, t.n))));
  const right = el("div", {class: "grid", style: "grid-template-columns:1fr"},
    lane("Units", d.units.length, d.units.map(u => unitCard(u)), "No matching units."),
    lane("Messages", d.messages.length, d.messages.map(m => msgCard(m, {teach: false})), "No matching messages."));
  $("main").replaceChildren(el("div", {class: "grid g2"},
    lane(`Matches for “${q}”`, d.people.length + d.channels.length + d.tags.length, [left],
      "No people, chats or tags matched."), right));
  enhanceGrids($("main"));
};
// optional ?tab=&scope= on first load (shareable deep link)
const _p = new URLSearchParams(location.search);
if (_p.get("theme")) applyTheme(_p.get("theme"));
if (_p.get("scope")) SCOPE = _p.get("scope");
if (_p.get("view") === "graph" || _p.get("view") === "list") EXPLORE_VIEW = _p.get("view");
if (_p.get("demo") === "chat") CHAT = [                      // a sample conversation for docs/screenshots
  {role: "user", content: "What are my deadlines this week, and what's the main thing happening in MimicNet?"},
  {role: "assistant", cost: 0.0094, changes: [], content:
    "**This week's deadline**\n- Submit the workshop paper draft [[u:34]] — flagged as high importance in [[g:Robotics RL & Control]].\n\n"
    + "**MimicNet right now**\nThe big active thread is *MimicNet reproduction and cross-domain transfer* [[u:7]] — the group is reproducing the "
    + "motion-imitation method and checking where it transfers. Two concrete follow-ups:\n"
    + "1. Compare the two retargeting implementations and note the trade-offs [[u:12]] ([[p:Diego]])\n"
    + "2. The merge decision was made: fold the RGMT-style variant into the main repo.\n\n"
    + "Also worth a look: the action-plan-then-distill idea [[u:6]] from the world-model thread."},
];
const _tab0 = _p.get("tab");
api("/api/views").then(v => { VIEWS = v || []; if (_tab0) TAB = _tab0; render(false); });
setInterval(() => { if (!document.hidden && document.activeElement !== $("q")) render(); }, 120000);
</script>
